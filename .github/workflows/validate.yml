name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install validation dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v rg >/dev/null || brew install ripgrep
          command -v shellcheck >/dev/null || brew install shellcheck
          command -v chezmoi >/dev/null || brew install chezmoi

      - name: Install validation dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md Brewfile
            .chezmoi.toml.tmpl .chezmoiignore
            dot_zshrc dot_zprofile dot_gitconfig
            dot_config/starship.toml.tmpl
            dot_config/nvim/init.lua
            dot_config/nvim/lua/config/lazy.lua
            dot_config/zsh/options.zsh
            dot_config/zsh/paths.zsh.tmpl
            dot_config/zsh/completion.zsh
            dot_config/zsh/aliases.zsh
            dot_config/zsh/functions.zsh
            dot_config/zsh/dev.zsh.tmpl
            dot_config/zsh/tools.zsh
            manifests/vscode-extensions.txt
            manifests/windows-packages.txt
            scripts/lib.sh
            scripts/check-secrets.sh
            scripts/macos/apply-preferences.sh
            scripts/macos/macos-defaults.sh
            scripts/macos/register-jdks.sh
            scripts/macos/install-vscode-extensions.sh
            scripts/windows/bootstrap.ps1
            Documents/PowerShell/Microsoft.PowerShell_profile.ps1
            AppData/Roaming/Code/User/settings.json.tmpl
            AppData/Local/nvim/init.lua.tmpl
            .gitattributes
          )
          for path in "${required[@]}"; do
            test -e "$path" || { echo "Missing required path: $path" >&2; exit 1; }
          done

      - name: Render and syntax-check shell (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Plain Zsh modules.
          for file in dot_zshrc dot_zprofile dot_config/zsh/*.zsh; do
            zsh -n "$file"
          done
          # Templated Zsh modules, rendered for the current OS.
          for tmpl in dot_config/zsh/*.zsh.tmpl; do
            chezmoi execute-template --source "$PWD" < "$tmpl" | zsh -n
          done
          # Bootstrap scripts and templated run scripts.
          for file in scripts/*.sh scripts/*/*.sh; do
            bash -n "$file"
          done
          for tmpl in run_*.sh.tmpl; do
            rendered="$(chezmoi execute-template --source "$PWD" < "$tmpl")"
            [ -z "$rendered" ] || printf '%s\n' "$rendered" | bash -n
          done
          if command -v ruby >/dev/null; then ruby -c Brewfile; fi
          git config --file dot_gitconfig --list >/dev/null

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          # SC1091: library path is resolved at runtime from ${BASH_SOURCE}.
          shellcheck -x -e SC1091 scripts/lib.sh scripts/check-secrets.sh \
            scripts/macos/*.sh

      - name: Validate chezmoi templates and manifests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chezmoi execute-template --source "$PWD" < .chezmoi.toml.tmpl >/dev/null
          chezmoi execute-template --source "$PWD" < .chezmoiignore >/dev/null
          for manifest in manifests/*.txt; do
            entries="$(grep -vE '^[[:space:]]*(#|$)' "$manifest" || true)"
            [ -n "$entries" ] || { echo "empty manifest: $manifest" >&2; exit 1; }
            dupes="$(printf '%s\n' "$entries" | sort | uniq -d)"
            [ -z "$dupes" ] || { echo "duplicate entries in $manifest: $dupes" >&2; exit 1; }
          done

      - name: Validate the iTerm2 Dynamic Profile
        shell: bash
        run: |
          set -euo pipefail
          profile="private_Library/private_Application Support/iTerm2/DynamicProfiles/raioviajante.json"
          python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          profiles = d["Profiles"]
          assert isinstance(profiles, list) and profiles, "Profiles must be a non-empty list"
          for p in profiles:
              assert p.get("Name") and p.get("Guid"), "each profile needs Name and Guid"
          print("iTerm2 Dynamic Profile OK:", ", ".join(p["Name"] for p in profiles))
          ' "$profile"

      - name: Scan for secrets and machine-specific paths
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-secrets.sh
          # The managed Git identity (a github.com noreply address) is allowed;
          # the real personal address and absolute home paths are not.
          if rg -n --hidden --glob '!**/.git/**' --glob '!.github/workflows/validate.yml' \
            '(/Users/|/home/[a-z]|bryancalvarenga|outlook\.com)' .; then
            echo "Machine-specific identity or path found." >&2
            exit 1
          fi

      - name: Language audit (no user-authored Portuguese)
        shell: bash
        run: |
          set -euo pipefail
          scan_globs=(--hidden --glob '!**/.git/**' --glob '!.github/workflows/validate.yml')
          # Portuguese-distinctive letters (a with tilde, o with tilde, c-cedilla,
          # accented vowels).
          if rg -n "${scan_globs[@]}" '[\x{00E3}\x{00F5}\x{00E7}\x{00E1}\x{00E2}\x{00E0}\x{00E9}\x{00EA}\x{00ED}\x{00F3}\x{00F4}]' . ; then
            echo "Portuguese-looking characters found." >&2
            exit 1
          fi
          # Common Portuguese words unlikely in English technical prose.
          if rg -n "${scan_globs[@]}" -i -w \
            'nao|funcao|instalacao|configuracao|arquivo|senha|usuario|tambem|voce|reproduzivel|necessario|entrada|saida|ambiente' . ; then
            echo "Portuguese words found." >&2
            exit 1
          fi
          echo "NO PORTUGUESE USER-AUTHORED CONTENT FOUND"

      - name: Whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIP '[ \t]+$' -- . ':!*.md'; then
            echo "Trailing whitespace found." >&2
            exit 1
          fi

      - name: Simulate chezmoi init + apply (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          cfg="$(mktemp -d)/chezmoi.toml"
          state="$(mktemp -d)/state.boltdb"
          cz() { chezmoi --config "$cfg" --source "$PWD" --destination "$dest" --persistent-state "$state" "$@"; }
          cz init
          cz apply --exclude=scripts,encrypted
          # Applying twice must be a no-op.
          cz apply --exclude=scripts,encrypted
          test -z "$(cz diff --exclude=scripts,encrypted)"

  validate-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install chezmoi
        run: choco install chezmoi --no-progress -y

      - name: PowerShell syntax
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -File -Include *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" } }
            else { Write-Host "ok $($file.Name)" }
          }

      - name: Profile loads without optional tools
        run: |
          $ErrorActionPreference = 'Stop'
          # A stripped PATH proves every optional CLI is guarded.
          $profilePath = Join-Path $env:GITHUB_WORKSPACE 'Documents\PowerShell\Microsoft.PowerShell_profile.ps1'
          $env:Path = "$PSHOME;$env:SystemRoot\System32"
          pwsh -NoLogo -NoProfile -Command ". '$profilePath'; if (`$Error) { `$Error; exit 1 }"
          if ($LASTEXITCODE) { throw 'the profile reported errors with no optional tools installed' }

      - name: Manifests
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'windows-packages.txt', 'vscode-extensions.txt') {
            $entries = Get-Content "manifests/$name" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') }
            if (-not $entries) { throw "empty manifest: $name" }
            $dupes = $entries | Group-Object { $_.ToLowerInvariant() } | Where-Object Count -gt 1
            if ($dupes) { throw "duplicate entries in ${name}: $($dupes.Name -join ', ')" }
          }
          $packages = Get-Content manifests/windows-packages.txt | Where-Object { $_ -and -not $_.TrimStart().StartsWith('#') }
          if ($packages -match 'bitwarden') { throw 'Bitwarden must not be a Windows package' }

      - name: Simulate chezmoi init + apply for Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'cz'
          New-Item -ItemType Directory -Force "$work\dest" | Out-Null
          function cz {
            chezmoi --config "$work\chezmoi.toml" --source $env:GITHUB_WORKSPACE --destination "$work\dest" --persistent-state "$work\state.boltdb" @args
            if ($LASTEXITCODE) { throw "chezmoi $args failed" }
          }
          cz init
          cz apply '--exclude=scripts,encrypted'
          # Applying twice must be a no-op.
          cz apply '--exclude=scripts,encrypted'
          if (cz diff '--exclude=scripts,encrypted') { throw 'chezmoi diff is not empty after apply' }
          $expected = 'Documents\PowerShell\Microsoft.PowerShell_profile.ps1', 'AppData\Roaming\Code\User\settings.json',
            'AppData\Local\nvim\init.lua', '.config\starship.toml'
          foreach ($target in $expected) {
            if (-not (Test-Path "$work\dest\$target")) { throw "missing target: $target" }
          }
          foreach ($unwanted in '.zshrc', '.config\zsh', '.config\nvim', 'Library') {
            if (Test-Path "$work\dest\$unwanted") { throw "Unix-only target applied on Windows: $unwanted" }
          }
          # The VS Code settings must be valid JSONC.
          $json = (Get-Content "$work\dest\AppData\Roaming\Code\User\settings.json" -Raw) -replace '(?m)^\s*//.*$', ''
          $null = $json | ConvertFrom-Json
          if ((Get-Content "$work\dest\.config\starship.toml" -Raw) -notmatch 'scan_timeout = 100') {
            throw 'Windows starship scan_timeout must be 100'
          }
