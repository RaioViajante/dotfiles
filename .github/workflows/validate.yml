name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install validation dependencies
        run: |
          command -v rg >/dev/null || brew install ripgrep
          command -v shellcheck >/dev/null || brew install shellcheck
          command -v chezmoi >/dev/null || brew install chezmoi

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md Brewfile setup
            brew/apps.Brewfile brew/dev.Brewfile brew/ai.Brewfile
            brew/content.Brewfile brew/shell.Brewfile brew/vscode.Brewfile
            brew/nvim.Brewfile
            .chezmoi.toml.tmpl .chezmoiignore
            dot_zshrc dot_zprofile dot_gitconfig
            dot_config/starship.toml
            dot_config/nvim/init.lua
            dot_config/nvim/lua/config/lazy.lua
            dot_config/zsh/options.zsh
            dot_config/zsh/paths.zsh
            dot_config/zsh/completion.zsh
            dot_config/zsh/aliases.zsh
            dot_config/zsh/functions.zsh
            dot_config/zsh/dev.zsh
            dot_config/zsh/tools.zsh
            dot_config/studio/studio.zsh
            manifests/vscode-extensions.txt
            scripts/lib.sh
            scripts/check-secrets.sh
            scripts/check-modules.sh
            scripts/check-docs.sh
            scripts/check-studio.sh
            scripts/macos/apply-preferences.sh
            scripts/macos/setup-studio.sh
            scripts/macos/macos-defaults.sh
            scripts/macos/register-jdks.sh
            scripts/macos/install-vscode-extensions.sh
            .gitattributes
          )
          for path in "${required[@]}"; do
            test -e "$path" || { echo "Missing required path: $path" >&2; exit 1; }
          done

      - name: Render and syntax-check shell
        shell: bash
        run: |
          set -euo pipefail
          # Plain Zsh modules.
          for file in dot_zshrc dot_zprofile dot_config/zsh/*.zsh dot_config/studio/*.zsh; do
            zsh -n "$file"
          done
          # Setup command, helper scripts and any templated run scripts.
          shopt -s nullglob
          for file in setup scripts/*.sh scripts/*/*.sh; do
            bash -n "$file"
          done
          for tmpl in run_*.sh.tmpl; do
            rendered="$(chezmoi execute-template --source "$PWD" < "$tmpl")"
            [ -z "$rendered" ] || printf '%s\n' "$rendered" | bash -n
          done
          if command -v ruby >/dev/null; then
            for brewfile in Brewfile brew/*.Brewfile brew/shared/*.Brewfile; do
              ruby -c "$brewfile" >/dev/null
            done
          fi
          git config --file dot_gitconfig --list >/dev/null

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          # SC1091: library path is resolved at runtime from ${BASH_SOURCE}.
          shellcheck -x -e SC1091 setup scripts/lib.sh scripts/check-secrets.sh \
            scripts/check-modules.sh scripts/check-docs.sh scripts/check-studio.sh \
            scripts/macos/*.sh

      - name: Validate chezmoi templates and manifests
        shell: bash
        run: |
          set -euo pipefail
          chezmoi execute-template --source "$PWD" < .chezmoi.toml.tmpl >/dev/null
          chezmoi execute-template --source "$PWD" < .chezmoiignore >/dev/null
          for manifest in manifests/*.txt; do
            entries="$(grep -vE '^[[:space:]]*(#|$)' "$manifest" || true)"
            [ -n "$entries" ] || { echo "empty manifest: $manifest" >&2; exit 1; }
            dupes="$(printf '%s\n' "$entries" | sort | uniq -d)"
            [ -z "$dupes" ] || { echo "duplicate entries in $manifest: $dupes" >&2; exit 1; }
          done

      - name: Validate setup modules
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-modules.sh
          ./setup --help >/dev/null
          # No module selected: print help and refuse to install anything.
          if ./setup >/dev/null 2>&1; then
            echo "setup without a module must not succeed" >&2
            exit 1
          fi
          # Mode boundaries (dry runs with a throwaway HOME).
          export HOME="$(mktemp -d)"
          if ./setup --dry-run --packages-only --no-packages dev >/dev/null 2>&1; then
            echo "conflicting modes must be rejected" >&2
            exit 1
          fi
          if ./setup --dry-run --packages-only git >/dev/null 2>&1; then
            echo "--packages-only git has nothing to do and must fail" >&2
            exit 1
          fi
          plan="$(./setup --dry-run --packages-only all 2>&1)"
          if grep -qE 'applying configuration|chezmoi apply|set-iterm-default-profile' <<<"$plan"; then
            echo "--packages-only must not apply configuration" >&2
            exit 1
          fi
          plan="$(./setup --dry-run --no-packages all 2>&1)"
          if grep -qE 'would install|install-ai-clis|setup-rust|install-vscode-extensions' <<<"$plan"; then
            echo "--no-packages must not install software" >&2
            exit 1
          fi
          # Profiles expand to explicit modules, keep every mode and add no
          # packages of their own.
          expected_profiles="$(printf '%s\t%s\n' \
            core 'shell git' \
            development 'shell git dev vscode nvim ai' \
            content-creation 'shell git content studio' \
            full 'apps dev ai content shell git vscode nvim studio')"
          test "$(./setup --print-profiles)" = "$expected_profiles" || {
            echo "profile definitions changed unexpectedly" >&2
            exit 1
          }
          for profile in core development content-creation full; do
            ./setup --dry-run --profile "$profile" >/dev/null 2>&1 ||
              { echo "profile $profile must be accepted" >&2; exit 1; }
            ./setup --dry-run --profile="$profile" >/dev/null 2>&1 ||
              { echo "--profile=$profile must be accepted" >&2; exit 1; }
          done
          for bad in "--profile" "--profile bogus" "--profile core --packages-only --no-packages"; do
            # shellcheck disable=SC2086 # plain words
            if ./setup --dry-run $bad >/dev/null 2>&1; then
              echo "must be rejected: ./setup $bad" >&2
              exit 1
            fi
          done
          # A profile selects the same plan as its modules written out.
          norm() { sed 's/\x1b\[[0-9;]*m//g'; }
          test "$(./setup --dry-run --profile content-creation 2>&1 | norm)" = \
               "$(./setup --dry-run shell git content studio 2>&1 | norm)" || {
            echo "profile plan differs from its explicit modules" >&2
            exit 1
          }
          plan="$(./setup --dry-run --profile content-creation --packages-only 2>&1)"
          if grep -qE 'applying configuration|chezmoi apply|setup-studio' <<<"$plan"; then
            echo "--packages-only must not apply configuration with a profile" >&2
            exit 1
          fi
          grep -q 'would install: brew "whisper.cpp"' <<<"$plan" || {
            echo "content-creation must install whisper.cpp" >&2
            exit 1
          }
          plan="$(./setup --dry-run --profile full --no-packages 2>&1)"
          if grep -qE 'would install|install-ai-clis|setup-rust|install-vscode-extensions' <<<"$plan"; then
            echo "--no-packages must not install software with a profile" >&2
            exit 1
          fi
          # The studio module has no software of its own.
          if ./setup --dry-run --packages-only studio >/dev/null 2>&1; then
            echo "--packages-only studio has nothing to do and must fail" >&2
            exit 1
          fi

      - name: Validate the studio module
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-studio.sh

      - name: Validate documentation
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-docs.sh

      - name: Validate the iTerm2 Dynamic Profile
        shell: bash
        run: |
          set -euo pipefail
          profile="private_Library/private_Application Support/iTerm2/DynamicProfiles/raioviajante.json"
          python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          profiles = d["Profiles"]
          assert isinstance(profiles, list) and profiles, "Profiles must be a non-empty list"
          for p in profiles:
              assert p.get("Name") and p.get("Guid"), "each profile needs Name and Guid"
          print("iTerm2 Dynamic Profile OK:", ", ".join(p["Name"] for p in profiles))
          ' "$profile"

      - name: Scan for secrets and machine-specific paths
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-secrets.sh
          # GitHub noreply addresses are allowed; the real personal address and
          # absolute home paths are not.
          if rg -n --hidden --glob '!**/.git/**' --glob '!.github/workflows/validate.yml' \
            '(/Users/|/home/[a-z]|bryancalvarenga|outlook\.com)' .; then
            echo "Machine-specific identity or path found." >&2
            exit 1
          fi

      - name: Language audit (no user-authored Portuguese)
        shell: bash
        run: |
          set -euo pipefail
          scan_globs=(--hidden --glob '!**/.git/**' --glob '!.github/workflows/validate.yml')
          # Portuguese-distinctive letters (a with tilde, o with tilde, c-cedilla,
          # accented vowels).
          if rg -n "${scan_globs[@]}" '[\x{00E3}\x{00F5}\x{00E7}\x{00E1}\x{00E2}\x{00E0}\x{00E9}\x{00EA}\x{00ED}\x{00F3}\x{00F4}]' . ; then
            echo "Portuguese-looking characters found." >&2
            exit 1
          fi
          # Common Portuguese words unlikely in English technical prose.
          if rg -n "${scan_globs[@]}" -i -w \
            'nao|funcao|instalacao|configuracao|arquivo|senha|usuario|tambem|voce|reproduzivel|necessario|entrada|saida|ambiente' . ; then
            echo "Portuguese words found." >&2
            exit 1
          fi
          echo "NO PORTUGUESE USER-AUTHORED CONTENT FOUND"

      - name: Whitespace check
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIP '[ \t]+$' -- . ':!*.md'; then
            echo "Trailing whitespace found." >&2
            exit 1
          fi

      - name: Simulate chezmoi init + apply
        shell: bash
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          cfg="$(mktemp -d)/chezmoi.toml"
          state="$(mktemp -d)/state.boltdb"
          cz() { chezmoi --config "$cfg" --source "$PWD" --destination "$dest" --persistent-state "$state" "$@"; }
          cz init
          cz apply --exclude=scripts,encrypted
          # Applying twice must be a no-op.
          cz apply --exclude=scripts,encrypted
          test -z "$(cz diff --exclude=scripts,encrypted)"
          expected=(
            .zshrc .zprofile .gitconfig .config/git/local.gitconfig
            .config/zsh/paths.zsh .config/zsh/dev.zsh
            .config/starship.toml .config/nvim/init.lua
            .config/studio/studio.zsh
            'Library/Application Support/Code/User/settings.json'
            'Library/Application Support/iTerm2/DynamicProfiles/raioviajante.json'
          )
          for target in "${expected[@]}"; do
            test -f "$dest/$target" || { echo "Missing applied target: $target" >&2; exit 1; }
          done
