add_newline = false
command_timeout = 800
scan_timeout = 20

[directory]
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = "git:"

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[nodejs]
symbol = "node:"

[java]
symbol = "java:"

[docker_context]
symbol = "docker:"
